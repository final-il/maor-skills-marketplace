<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentation</title>
<style>
:root{
  --bg:#050b17; --bg2:#0a1628; --panel:rgba(16,36,62,.55); --line:rgba(120,190,255,.16);
  --cyan:#4fd6ea; --gold:#f3c46b; --violet:#8c6cff; --blue:#3a7bff; --red:#ff4d5e; --green:#3ee08f;
  --text:#eaf1fa; --muted:#93a6bf; --dim:#5d6f88;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --font:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 40%,rgba(2,6,14,.75) 100%)}

/* ---------- stage: fixed 1600x900 canvas scaled to fit ---------- */
.stage{position:fixed;left:50%;top:50%;width:1600px;height:900px;z-index:2;transform-origin:center center}
.slide{position:absolute;inset:0;padding:90px 110px;opacity:0;visibility:hidden;
  transition:opacity .7s var(--ease),transform .9s var(--ease),filter .7s var(--ease),visibility 0s .9s;
  transform:translateX(60px) scale(.98);filter:blur(8px)}
.slide.before{transform:translateX(-60px) scale(.98)}
.slide.active{opacity:1;visibility:visible;transform:none;filter:none;transition-delay:0s}

/* staggered reveal: class="rv" style="--d:.15" (seconds); variants .l .r .s .z */
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .9s var(--ease);transition-delay:calc(var(--d,0) * 1s + .25s)}
.rv.l{transform:translateX(-40px)} .rv.r{transform:translateX(40px)} .rv.s{transform:scale(.85)} .rv.z{transform:scale(1.08)}
.active .rv{opacity:1;transform:none}

/* ---------- typography ---------- */
.kicker{font-size:22px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.presenter{display:inline-flex;align-items:center;gap:12px;font-size:21px;color:var(--cyan);font-weight:500}
.presenter::before{content:"";width:34px;height:2px;background:linear-gradient(90deg,var(--cyan),transparent)}
h1{font-size:120px;font-weight:800;letter-spacing:-.03em;line-height:1}
h2{font-size:60px;font-weight:750;letter-spacing:-.02em;line-height:1.08}
h3{font-size:30px;font-weight:700;color:var(--cyan);letter-spacing:-.005em}
p,li{font-size:25px;line-height:1.5;color:#c9d6e6}
.muted{color:var(--muted)} .gold{color:var(--gold)}
.grad{background:linear-gradient(100deg,#fff 0%,#9fe9ff 35%,#a58cff 65%,#fff 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.head{display:flex;flex-direction:column;gap:18px;margin-bottom:54px}
.tag{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border:1px solid var(--line);border-radius:999px;
  font-size:18px;color:var(--muted);background:rgba(10,24,44,.6);backdrop-filter:blur(6px)}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--gold));box-shadow:0 0 12px var(--c,var(--gold));animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.7)}}

/* ---------- surfaces ---------- */
.card{background:linear-gradient(160deg,rgba(24,52,88,.62),rgba(10,22,40,.62));border:1px solid var(--line);border-radius:22px;
  backdrop-filter:blur(10px);box-shadow:0 20px 60px -20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 50%,transparent 70%);background-size:250% 100%;background-position:150% 0}
.active .card::after{animation:sweep 1.6s var(--ease) calc(var(--d,0) * 1s + .6s) 1 both}
@keyframes sweep{to{background-position:-100% 0}}

/* full-bleed image: <div class="bleed"><img src="assets/x.jpg"></div>, darken the text side on ::after */
.bleed{position:absolute;inset:0;overflow:hidden}
.bleed img{width:100%;height:100%;object-fit:cover;transform:scale(1.12);transition:transform 9s cubic-bezier(.2,.6,.2,1)}
.active .bleed img{transform:scale(1)}
.bleed::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,11,23,.92) 0%,rgba(5,11,23,.55) 45%,transparent 75%)}

/* ---------- characters: <div class="pp" data-person="team|manager|builder" data-color="#hex" data-mood="smile|o|worry"> ---------- */
.pp{position:absolute;width:90px;height:146px}
.pp svg{width:100%;height:100%;overflow:visible;animation:st-bob 2.6s ease-in-out infinite;animation-delay:var(--bd,0s)}
.pp .eyes{transform-box:fill-box;transform-origin:center;animation:st-blink 4.2s infinite;animation-delay:var(--bd,0s)}
@keyframes st-bob{50%{transform:translateY(-5px)}}
@keyframes st-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

/* ---------- story scenes: class="slide story", progress pips in .chap ---------- */
.story{padding:80px 110px}
.chap{display:inline-flex;align-items:center;gap:14px;font-size:16px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chap .pips{display:inline-flex;gap:5px}
.chap .pips i{width:18px;height:4px;border-radius:2px;background:rgba(255,255,255,.14)}
.chap .pips i.on{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.cap{position:absolute;left:0;right:0;bottom:118px;text-align:center;font-size:36px;font-weight:650;letter-spacing:-.01em}
.cap em{font-style:normal;color:var(--cyan)}

/* ---------- video slide ---------- */
.vid{padding:56px 110px;display:flex;flex-direction:column;align-items:center;gap:26px}
.vhead{align-self:stretch;display:flex;align-items:baseline;justify-content:space-between;gap:30px}
.vhead .kicker{font-size:18px;order:2}
.vbox{position:relative;width:1152px;height:648px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#000;
  box-shadow:0 40px 100px -30px rgba(0,0,0,.8),0 0 80px -20px rgba(120,90,255,.35)}
.vbox video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
.vplay{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;cursor:pointer;
  border:1px solid rgba(255,255,255,.35);background:rgba(10,24,44,.55);backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;
  animation:vpulse 2.4s infinite;transition:opacity .3s,transform .3s}
.vplay svg{width:52px;height:52px;margin-left:6px}
.vplay:hover{transform:scale(1.06)}
.vbox.playing .vplay{opacity:0;pointer-events:none}
@keyframes vpulse{0%{box-shadow:0 0 0 0 rgba(160,140,255,.5)}70%,100%{box-shadow:0 0 0 26px rgba(160,140,255,0)}}

/* ---------- sample slides (replace) ---------- */
.s-title .inner{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;gap:24px}
.s-title h1{font-size:170px;letter-spacing:-.045em}
.s-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.s-grid .card{padding:34px 34px 38px;border-top:4px solid var(--c);box-shadow:0 30px 80px -40px var(--c)}
.s-grid b{display:block;font-size:30px;font-weight:750;margin:18px 0 10px}
.s-grid p{font-size:21px;color:var(--muted)}
.s-close .inner{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px}
.s-close h1{font-size:150px}

/* ---------- chrome ---------- */
.chrome{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;gap:18px;padding:16px 26px;opacity:.25;transition:opacity .4s}
.chrome:hover,body.idle-off .chrome{opacity:1}
.prog{position:fixed;left:0;top:0;height:3px;z-index:11;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 12px var(--cyan);transition:width .7s var(--ease)}
.dots{position:fixed;left:26px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:12px;opacity:.55;transition:opacity .4s}
.dots:hover,body.idle-off .dots{opacity:1}
.dots button{position:relative;width:10px;height:10px;border-radius:50%;border:0;background:rgba(255,255,255,.28);cursor:pointer;transition:height .35s var(--ease),background .3s,box-shadow .3s}
.dots button:hover{background:rgba(255,255,255,.6)}
.dots button.on{height:30px;border-radius:5px;background:var(--cyan);box-shadow:0 0 12px rgba(79,214,234,.7)}
.dots button::after{content:attr(data-label);position:absolute;left:24px;top:50%;transform:translate(-6px,-50%);white-space:nowrap;
  padding:6px 12px;border-radius:8px;font:500 13px var(--font);color:var(--text);background:rgba(10,24,44,.92);border:1px solid var(--line);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.dots button:hover::after{opacity:1;transform:translate(0,-50%)}
.btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(10,24,44,.7);color:var(--text);cursor:pointer;display:grid;place-items:center;font-size:18px}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:56px;text-align:right;letter-spacing:.08em}
.hint{position:fixed;right:26px;top:20px;z-index:10;font-size:13px;color:var(--dim);letter-spacing:.06em;transition:opacity 1s}

/* ---------- overview (O): every slide must look finished here ---------- */
body.overview .dots{display:none}
body.overview .stage{transform:none!important;left:0;top:0;width:100%;height:100%;overflow:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:40px;align-content:start}
body.overview .slide{position:relative;inset:auto;opacity:1;visibility:visible;filter:none;transform:none;width:1600px;height:900px;zoom:.2;
  border:3px solid var(--line);border-radius:30px;cursor:pointer;background:var(--bg2);overflow:hidden;transition:border-color .2s}
body.overview .slide:hover{border-color:var(--cyan)}
body.overview .slide .rv{opacity:1;transform:none}
body.overview .slide *{transition:none!important;animation:none!important}
body.overview .bleed img{transform:none}

@media (prefers-reduced-motion: reduce){.slide,.rv{transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="vignette"></div>
<div class="prog" id="prog"></div>
<div class="hint" id="hint">← → navigate · F fullscreen · O overview</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="pp-shade" cx=".35" cy=".28" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></radialGradient>
  </defs>
</svg>

<main class="stage" id="stage">

<!-- Each slide: <section class="slide" id="…" data-title="label for the page dot"> -->
<section class="slide s-title" id="title" data-title="Title">
  <!-- <div class="bleed"><img src="assets/hero.jpg" alt=""></div> -->
  <div class="inner">
    <div class="kicker rv" style="--d:0">Kicker</div>
    <h1 class="grad rv" style="--d:.15">Headline</h1>
    <div class="rv" style="--d:.35"><span class="presenter">Presenter</span></div>
  </div>
</section>

<section class="slide" id="grid" data-title="Cards">
  <div class="head">
    <div class="kicker rv" style="--d:0">Kicker</div>
    <h2 class="rv" style="--d:.1">Slide title</h2>
  </div>
  <div class="s-grid">
    <div class="card rv" style="--d:.25;--c:#4fd6ea"><span class="tag"><i></i>Tag</span><b>Card</b><p>Body copy.</p></div>
    <div class="card rv" style="--d:.4;--c:#a58cff"><span class="tag"><i></i>Tag</span><b>Card</b><p>Body copy.</p></div>
    <div class="card rv" style="--d:.55;--c:#3ee08f"><span class="tag"><i></i>Tag</span><b>Card</b><p>Body copy.</p></div>
  </div>
</section>

<!-- Video slide (single file: the mp4 is inlined as <script type="application/octet-stream" id="emb-KEY"> and <video data-embed="KEY">)
<section class="slide vid" id="video" data-title="Video">
  <div class="vhead"><div class="kicker rv" style="--d:0">Kicker</div><h2 class="rv" style="--d:.1">Title</h2></div>
  <div class="vbox rv s" style="--d:.25">
    <video src="assets/clip.mp4" poster="assets/clip-poster.jpg" controls playsinline preload="metadata"></video>
    <button class="vplay" aria-label="Play video"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></button>
  </div>
</section>
-->

<section class="slide s-close" id="close" data-title="Thank you">
  <div class="inner">
    <div class="kicker rv" style="--d:0">Kicker</div>
    <h1 class="grad rv s" style="--d:.15">Thank you</h1>
    <p class="muted rv" style="--d:.4">Questions &amp; discussion</p>
  </div>
</section>

</main>

<nav class="dots" id="dots" aria-label="Slides"></nav>
<nav class="chrome" id="chrome">
  <button class="btn" id="prev" aria-label="Previous">‹</button>
  <span style="flex:1"></span>
  <span class="count" id="count"></span>
  <button class="btn" id="next" aria-label="Next">›</button>
  <button class="btn" id="fs" aria-label="Fullscreen" title="Fullscreen (F)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg></button>
</nav>

<script>
(() => {
  const stage = document.getElementById('stage');
  const slides = [...stage.querySelectorAll('.slide')];
  const dots = document.getElementById('dots');
  const N = slides.length;
  const ENTER = {};            // ENTER['slide-id'] = () => {…} runs each time that slide opens
  let cur = -1;

  function fit() {
    if (document.body.classList.contains('overview')) return;
    const s = Math.min(innerWidth / 1600, innerHeight / 900);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  slides.forEach((s, i) => {
    const b = document.createElement('button');
    b.setAttribute('aria-label', `Slide ${i + 1}`);
    b.dataset.label = `${String(i + 1).padStart(2, '0')}  ${s.dataset.title || ''}`;
    b.onclick = () => go(i);
    dots.appendChild(b);
  });

  // <span data-count="81" data-decimals="0" data-suffix="%">0</span>
  function countUp(el) {
    const end = parseFloat(el.dataset.count), dec = +(el.dataset.decimals || 0), suf = el.dataset.suffix || '';
    const t0 = performance.now() + 500, dur = 1600;
    const fmt = v => v.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + suf;
    el.textContent = fmt(0);
    (function tick(t) {
      const k = Math.min(Math.max((t - t0) / dur, 0), 1);
      el.textContent = fmt(end * (1 - Math.pow(1 - k, 4)));
      if (k < 1 && slides[cur]?.contains(el)) requestAnimationFrame(tick); else if (k >= 1) el.textContent = fmt(end);
    })(performance.now());
  }

  function go(i) {
    i = Math.max(0, Math.min(N - 1, i));
    if (i === cur) return;
    slides.forEach((s, k) => { s.classList.toggle('active', k === i); s.classList.toggle('before', k < i); });
    cur = i;
    stage.querySelectorAll('video').forEach(v => slides[i].contains(v) || v.pause());
    slides[i].querySelectorAll('[data-count]').forEach(countUp);
    ENTER[slides[i].id]?.();
    [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
    document.getElementById('count').textContent = `${String(i + 1).padStart(2, '0')} / ${String(N).padStart(2, '0')}`;
    document.getElementById('prog').style.width = `${((i + 1) / N) * 100}%`;
    history.replaceState(null, '', `#${i + 1}`);
  }

  function toggleOverview(force) {
    const on = document.body.classList.toggle('overview', force);
    if (on) stage.style.transform = ''; else fit();
  }
  slides.forEach((s, i) => s.addEventListener('click', () => {
    if (document.body.classList.contains('overview')) { toggleOverview(false); cur = -1; go(i); }
  }));

  const fsToggle = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
  document.getElementById('prev').onclick = () => go(cur - 1);
  document.getElementById('next').onclick = () => go(cur + 1);
  document.getElementById('fs').onclick = fsToggle;

  addEventListener('keydown', e => {
    const vid = slides[cur]?.querySelector('video');
    if (vid && [' ', 'Enter', 'k', 'K'].includes(e.key)) { e.preventDefault(); vid.paused ? vid.play() : vid.pause(); return; }
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); go(cur + 1); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(N - 1);
    else if (e.key.toLowerCase() === 'f') fsToggle();
    else if (e.key.toLowerCase() === 'o' || e.key === 'Escape') toggleOverview(e.key === 'Escape' ? false : undefined);
  });

  let tx = null;
  addEventListener('touchstart', e => tx = e.touches[0].clientX, { passive: true });
  addEventListener('touchend', e => {
    if (tx === null) return;
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1));
    tx = null;
  });

  let idle;
  addEventListener('mousemove', () => {
    document.body.classList.add('idle-off'); clearTimeout(idle);
    idle = setTimeout(() => document.body.classList.remove('idle-off'), 2200);
  });
  setTimeout(() => document.getElementById('hint').style.opacity = 0, 5000);

  // ---------- characters ----------
  const BODY = 'M14 124V88a26 26 0 0 1 52 0v36z';
  function person(kind, color, mood, look) {
    const c = color || (kind === 'manager' ? '#9b82ff' : '#4fd6ea');
    const ey = look === 'up' ? 31 : 37;
    const mouth = mood === 'o' ? '<circle cx="40" cy="50" r="3.6" fill="#06101e"/>'
      : mood === 'worry' ? '<path d="M33 52q7-6 14 0" stroke="#06101e" stroke-width="2.6" fill="none" stroke-linecap="round"/>'
      : '<path d="M32 47q8 7 16 0" stroke="#06101e" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
    const tie = kind === 'manager' ? '<path d="M37 62h6l2 6-5 24-5-24z" fill="#f3c46b"/>' : '';
    const lap = kind === 'builder' ? '<rect x="18" y="92" width="44" height="26" rx="3" fill="#0b1a2e" stroke="#4fd6ea" stroke-width="2"/><circle cx="40" cy="105" r="3" fill="#4fd6ea"/>' : '';
    return `<svg viewBox="0 0 80 130"><ellipse cx="40" cy="126" rx="22" ry="4" fill="rgba(0,0,0,.45)"/>
      <path d="${BODY}" fill="${c}"/><path d="${BODY}" fill="url(#pp-shade)"/>
      <circle cx="40" cy="38" r="24" fill="${c}"/><circle cx="40" cy="38" r="24" fill="url(#pp-shade)"/>
      ${tie}<g class="eyes"><circle cx="32" cy="${ey}" r="3.3" fill="#06101e"/><circle cx="48" cy="${ey}" r="3.3" fill="#06101e"/></g>${mouth}${lap}</svg>`;
  }
  document.querySelectorAll('[data-person]').forEach(el =>
    el.insertAdjacentHTML('afterbegin', person(el.dataset.person, el.dataset.color, el.dataset.mood, el.dataset.look)));

  // ---------- story progress pips ----------
  const stories = [...document.querySelectorAll('.slide.story')];
  stories.forEach((s, i) => s.querySelectorAll('.pips').forEach(p =>
    p.innerHTML = stories.map((_, k) => `<i${k <= i ? ' class="on"' : ''}></i>`).join('')));

  // ---------- video: play overlay; inlined video becomes a blob URL ----------
  stage.querySelectorAll('.vbox').forEach(box => {
    const v = box.querySelector('video');
    box.querySelector('.vplay').onclick = () => v.play();
    v.addEventListener('play', () => box.classList.add('playing'));
    v.addEventListener('pause', () => box.classList.remove('playing'));
  });
  addEventListener('DOMContentLoaded', () => document.querySelectorAll('video[data-embed]').forEach(v => {
    const el = document.getElementById(`emb-${v.dataset.embed}`);
    fetch(`data:video/mp4;base64,${el.textContent.trim()}`).then(r => r.blob())
      .then(b => { v.src = URL.createObjectURL(b); el.remove(); });
  }));

  go(Math.max(0, (parseInt(location.hash.slice(1)) || 1) - 1));

  // ---------- background: fibre strands with sparks (approved speed; do not speed up) ----------
  const cv = document.getElementById('bg'), cx = cv.getContext('2d');
  let W, H; const DPR = Math.min(devicePixelRatio || 1, 2);
  function size() { W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR; }
  addEventListener('resize', size); size();
  const strands = Array.from({ length: 26 }, () => ({
    off: Math.random() * 1000, amp: .06 + Math.random() * .14, freq: .6 + Math.random() * 1.4,
    y: .15 + Math.random() * .8, hue: 200 + Math.random() * 70, sp: .0000005 + Math.random() * .000001, w: .5 + Math.random() * 1.3
  }));
  const sparks = Array.from({ length: 70 }, () => ({ s: Math.random(), k: Math.floor(Math.random() * 26), v: .00000375 + Math.random() * .00001 }));
  const yAt = (st, x, t) => (st.y + Math.sin(x * st.freq * 3 + t * st.sp * 1000 + st.off) * st.amp + Math.sin(x * 7 + st.off) * .015) * H;
  function draw(t) {
    cx.clearRect(0, 0, W, H);
    cx.globalCompositeOperation = 'lighter';
    for (const st of strands) {
      cx.beginPath();
      for (let x = 0; x <= 1.0001; x += .02) { const px = x * W, py = yAt(st, x, t); x ? cx.lineTo(px, py) : cx.moveTo(px, py); }
      cx.strokeStyle = `hsla(${st.hue},90%,62%,.07)`; cx.lineWidth = st.w * DPR; cx.stroke();
    }
    for (const p of sparks) {
      p.s += p.v; if (p.s > 1) p.s = 0;
      const st = strands[p.k], px = p.s * W, py = yAt(st, p.s, t);
      const g = cx.createRadialGradient(px, py, 0, px, py, 7 * DPR);
      g.addColorStop(0, `hsla(${st.hue},100%,80%,.55)`); g.addColorStop(1, 'transparent');
      cx.fillStyle = g; cx.fillRect(px - 7 * DPR, py - 7 * DPR, 14 * DPR, 14 * DPR);
    }
    cx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(draw);
  }
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(draw);
})();
